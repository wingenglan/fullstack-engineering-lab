services:
  # ============================================
  # MySQL Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-engineering_lab}
      MYSQL_USER: ${MYSQL_USER:-lab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-network

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-network

  # ============================================
  # Go Backend Server
  # ============================================
  server:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    container_name: lab-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-engineering_lab}
      MYSQL_USER: ${MYSQL_USER:-lab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-please_change_me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lab-network

  # ============================================
  # Vue Frontend
  # ============================================
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: lab-web
    restart: unless-stopped
    # ports:
    #   - "3000:80"   # Access via nginx instead
    networks:
      - lab-network

  # ============================================
  # VitePress Documentation
  # ============================================
  docs:
    build:
      context: ../apps/docs
      dockerfile: Dockerfile
    container_name: lab-docs
    restart: unless-stopped
    # ports:
    #   - "5174:80"   # Access via nginx instead
    networks:
      - lab-network

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: lab-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - web
      - docs
    networks:
      - lab-network

  # ============================================
  # Future Services (uncomment when ready)
  # ============================================
  # rabbitmq:
  #   image: rabbitmq:3-management-alpine
  #   container_name: lab-rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - lab-network

  # minio:
  #   image: minio/minio
  #   container_name: lab-minio
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   command: server /data --console-address ":9001"
  #   networks:
  #     - lab-network

volumes:
  mysql-data:
  redis-data:

networks:
  lab-network:
    driver: bridge
