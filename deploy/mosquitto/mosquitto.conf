# ============================================
# Mosquitto MQTT Broker 配置
# ============================================

# MQTT TCP 监听端口
listener 1883

# MQTT over WebSocket（供浏览器直连调试）
listener 9001
protocol websockets

# 允许匿名连接（Demo 环境）
allow_anonymous true

# ============================================
# 持久化配置
# ============================================
persistence true
persistence_location /mosquitto/data/

# ============================================
# 日志配置
# ============================================
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ============================================
# 连接限制（防止 Demo 环境被打爆）
# ============================================
max_connections 200
