app:
  name: "FullStack Engineering Lab"
  env: "dev"
  port: 8080

mysql:
  host: "localhost"
  port: 3307
  database: "engineering_lab"
  user: "lab_user"
  password: "lab_password"

redis:
  host: "localhost"
  port: 6380
  password: ""
  db: 0

jwt:
  secret: "please_change_me"
  expire_minutes: 120

mqtt:
  broker: "tcp://localhost:1883"
  client_id: "lab-server"
  username: ""
  password: ""
  subscribe_topics:
    - "sensors/#"
  simulator_interval_ms: 2000
  enabled: true

tcp:
  host: "0.0.0.0"
  port: 9090
  max_connections: 100
  read_timeout_sec: 30
  write_timeout_sec: 10
